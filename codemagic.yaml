workflows:
  ios-release:
    name: iOS Release → App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Embercrest Run Codemagic

    environment:
      groups:
        - code-signing
      flutter: 3.44.7
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.embercrest.rungame
        NSE_BUNDLE_ID: com.embercrest.rungame.NotificationService
        APP_STORE_APPLE_ID: "6792816894"
        APPLE_TEAM_ID: "T72S4TZ35D"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios-gray-part
          include: true

    scripts:
      - name: Disable Swift Package Manager (Firebase pulled via CocoaPods)
        script: flutter config --no-enable-swift-package-manager

      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          rm -rf Pods .symlinks Podfile.lock
          pod install
        working_directory: ios

      - name: Code signing & Build IPA
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --create
          app-store-connect fetch-signing-files "$NSE_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --create
          keychain add-certificates
          flutter build ios --release --no-codesign
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "ios/Runner.xcworkspace" \
            --scheme "Runner"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
