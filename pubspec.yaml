name: embercrest_run
description: "Embercrest Run - grow a living magma road across a supervolcano."
publish_to: 'none'
version: 1.0.1+5

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  audioplayers: ^6.5.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1

  webview_flutter: 4.13.0
  webview_flutter_wkwebview: 3.23.0
  appsflyer_sdk: 6.17.5
  app_tracking_transparency: 2.0.6
  firebase_core: 4.12.1
  firebase_messaging: 16.4.3
  http: 1.4.0
  connectivity_plus: 7.0.0
  device_info_plus: 12.2.0
  flutter_secure_storage: 10.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    # packed sprite atlas + lookup table (everything drawn during a run)
    - assets/atlas/
    # full-size art that is never batched
    - assets/Game_Name.webp
    - assets/Icon.png
    - assets/magma_boot_wide.webp
    - assets/magma_boot_tall.webp
    - assets/magma_notice_wide.webp
    - assets/magma_notice_tall.webp
    - assets/bg_location_1_asset.webp
    - assets/bg_location_2_asset.webp
    - assets/bg_location_3_asset.webp
    - assets/bg_location_4_asset.webp
    - assets/bg_location_5_asset.webp
    - assets/bg_location_6_asset.webp
    - sounds/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/Icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#120608"
  adaptive_icon_foreground: "assets/Icon.png"
