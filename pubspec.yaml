name: embercrest_run
description: "Embercrest Run - grow a living magma road across a supervolcano."
publish_to: 'none'
version: 1.0.1+6

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  audioplayers: ^6.5.0
  shared_preferences: ^2.5.2
  url_launcher: ^6.3.0

  webview_flutter: 4.12.0
  webview_flutter_wkwebview: 3.22.0
  appsflyer_sdk: 6.17.3
  app_tracking_transparency: 2.0.4
  firebase_core: 4.11.0
  firebase_messaging: 16.4.1
  http: 1.3.0
  connectivity_plus: 6.1.5
  device_info_plus: 11.5.0
  flutter_secure_storage: 9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    # packed sprite atlas + lookup table (everything drawn during a run)
    - assets/atlas/
    # full-size art that is never batched
    - assets/crest_wordmark.webp
    - assets/crest_mark.png
    - assets/caldera_wide.webp
    - assets/caldera_tall.webp
    - assets/ashpass_landscape.webp
    - assets/ashpass_portrait.webp
    - assets/rim_1.webp
    - assets/rim_2.webp
    - assets/rim_3.webp
    - assets/rim_4.webp
    - assets/rim_5.webp
    - assets/rim_6.webp
    - sounds/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/crest_mark.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#120608"
  adaptive_icon_foreground: "assets/crest_mark.png"
