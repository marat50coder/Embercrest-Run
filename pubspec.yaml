name: embercrest_run
description: "Embercrest Run - grow a living magma road across a supervolcano."
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # ── White game (Embercrest Run) ──
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

  # ── Gray flow ──
  webview_flutter: ^4.14.1
  webview_flutter_wkwebview: ^3.26.0
  appsflyer_sdk: ^6.18.0
  app_tracking_transparency: ^2.0.7
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  http: ^1.6.0
  # 7.1+ requires Xcode 26.1 for NWPath.isUltraConstrained.
  connectivity_plus: '>=7.0.0 <7.1.0'
  # 12.4+ calls an Xcode 26.1-only NSProcessInfo selector.
  device_info_plus: 12.3.0
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    # packed sprite atlas + lookup table (everything drawn during a run)
    - assets/atlas/
    # full-size art that is never batched
    - assets/Game_Name.webp
    - assets/Icon.png
    - assets/Horizontal_Loading_Screen.webp
    - assets/Vertical_Loading_Screen.webp
    # Gray-flow foreground screens (push permit + no-wifi).
    - assets/Horizontal_Notifications_Screen.webp
    - assets/Vertical_Notifications_Screen.webp
    - assets/Horizontal_Nowifi_Screen.webp
    - assets/Vertical_Nowifi_Screen.webp
    - assets/bg_location_1_asset.webp
    - assets/bg_location_2_asset.webp
    - assets/bg_location_3_asset.webp
    - assets/bg_location_4_asset.webp
    - assets/bg_location_5_asset.webp
    - assets/bg_location_6_asset.webp
    - sounds/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/Icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#120608"
  adaptive_icon_foreground: "assets/Icon.png"
